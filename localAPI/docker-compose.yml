services:
  ministack:
    image: ministackorg/ministack:1.5.34-full
    network_mode: "service:shim"
    environment:
      - SFTP_ENABLED=0
      - SERVICES=athena,cloudformation,cloudwatch,cloudwatchlogs,dynamodb,iam,kinesis,kms,lambda,logs,s3,secretsmanager,sns,sqs,ssm,stepfunctions
  shim:   # empty container to open ports
    image: ${DOCKER_REPOSITORY}node:22.21.1
    command:
      bash -c "tail -f /dev/null"
    working_dir:
      /cumulus-dashboard
    volumes:
      - ../:/cumulus-dashboard
    ports:
      - "9200:9200"
      - "4550-4599:4550-4599"
      - "5432:5432"
  postgres:
    image: postgres:17.4-alpine
    network_mode: "service:shim"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "postgres"
